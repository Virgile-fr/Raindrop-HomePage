<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self' https://api.raindrop.io; object-src 'none'; base-uri 'self'; form-action 'none';">
  <meta name="description" content="Vos favoris Raindrop dans une page d’accueil rapide et minimaliste.">
  <meta name="apple-mobile-web-app-title" content="HomePage">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧭%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="./apple-icon.png">
  <title>HomePage</title>
  <link href="./CSS/style.css" rel="stylesheet">
  <link href="./CSS/card.css" rel="stylesheet">
  <link href="./CSS/grid.css" rel="stylesheet">
  <link href="./CSS/header.css" rel="stylesheet">
  <link href="./CSS/toggle.css" rel="stylesheet">
  <link href="./CSS/colors.css" rel="stylesheet">
  <script src="./JS/storage.js" defer></script>
  <script src="./token.js" defer></script>
  <script src="./JS/favicons.js" defer></script>
  <script src="./JS/inserthtml.js" defer></script>
  <script src="./JS/dominant-color.js" defer></script>
  <script src="./JS/fetch.js" defer></script>
  <script src="./JS/toggle.js" defer></script>
</head>
<body>
  <header>
    <div class="header-group">
      <a class="raindrop-link" href="https://app.raindrop.io/my/0/" aria-label="Ouvrir Raindrop">
        <img src="https://miro.medium.com/max/1024/1*JtxOMEcB0N7yoGiHjFf1Gg.png" width="30" height="30" alt="" decoding="async">
      </a>
      <h1>Favorites</h1>
    </div>
    <div class="header-group controls">
      <button type="button" class="favorite-priority-toggle icon-button" aria-label="Changer la source des icônes" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2-6.2 3.2 1.2-6.8-5-4.9 6.9-1Z"/></svg>
      </button>
      <input type="checkbox" id="switch" role="switch" aria-label="Afficher les couvertures" />
      <label for="switch"><span class="sr-only">Afficher les couvertures</span></label>
      <svg class="cover-indicator" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg>
    </div>
  </header>
  <main>
    <div class="status" role="status" aria-live="polite"><span id="status-message"></span> <button id="retry" type="button" hidden>Réessayer</button></div>
    <div id="grid" aria-label="Favoris"></div>
    <noscript>Activez JavaScript pour afficher vos favoris Raindrop.</noscript>
  </main>
  <footer><button id="change-token" type="button">Configurer le token</button></footer>
</body>
</html>
